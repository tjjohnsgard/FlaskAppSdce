<!DOCTYPE html>
<html lang="en">
<head>
  <title>COMP 667</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- CSS Links -->
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="https://www.w3schools.com/lib/w3-theme-teal.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Custom Styles -->
<style>
  body, h1, h2, h3, h4, h5, h6 { font-family: 'Raleway', sans-serif; }
  
  /* Make page full height and blend background */
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    margin: 0;
    background-color: #000000; 
  }
  
  /* Margin: centers grid vertically and horizontally */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 25px; 
    padding: 25px; 
    max-width: 1200px;
    width: 100%;
    margin: auto; 
    background-color: #616161; 
    border-radius: 20px; 
  }

  /* Forces all four cards to be same size */
  .action-card {
    height: 320px; 
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  #myHeader, #myFooter {
    background: linear-gradient(135deg, #2c3e50 0%, #000000 100%);
    color: white;
  }
</style>
  
</head>
<body>

<!-- Side Navigation -->
<nav class="w3-sidebar w3-bar-block w3-card w3-animate-left w3-center" style="display:none" id="mySidebar">
  <h1 class="w3-xxxlarge w3-text-theme">Database Navigation</h1>
  <a href="/" class="w3-bar-item w3-button">Home</a>
  <a href="/view" class="w3-bar-item w3-button">View</a>
  <a href="/update" class="w3-bar-item w3-button">Update</a>
  <a href="/search" class="w3-bar-item w3-button">Search</a>
  <a href="/delete" class="w3-bar-item w3-button">Delete</a>
  <button class="w3-bar-item w3-button" onclick="w3_close()">Close <i class="fa fa-remove"></i></button>
</nav>
 
<!-- Header -->
<header class="w3-container w3-theme w3-padding" id="myHeader">
  <i onclick="w3_open()" class="fa fa-bars w3-xlarge w3-button w3-theme"></i> 
  <div class="w3-center">
    <!-- SDCCE Logo with absolute URL -->
    <img alt="San Diego College of Continuing Education Logo" height="39" loading="lazy" src="https://sdcce.edu/_resources/theme/images/logo.webp" class="w3-margin-top w3-margin-bottom">
    
    <h4>COMP 667</h4>
    <h1 class="w3-xxxlarge w3-animate-bottom">Intro to Software Development II</h1>
  </div>
</header>

<!-- Action Cards -->
<div class="card-grid">

  <a href="/view" class="w3-block w3-hover-opacity" style="text-decoration: none;">
    <div class="w3-card w3-container w3-round-xlarge w3-black action-card">
      <h3>View</h3>
      <i class="fa fa-desktop" aria-hidden="true" style="font-size:90px; color:#1abc9c; margin: 25px 0;"></i>
      <p>View entire database</p>
    </div>
  </a>  

  <a href="/update" class="w3-block w3-hover-opacity" style="text-decoration: none;">
    <div class="w3-card w3-container w3-round-xlarge w3-black action-card">
      <h3>Update</h3>
      <i class="fa fa-code-branch" aria-hidden="true" style="font-size:90px; color:#1abc9c; margin: 25px 0;"></i>
      <p>Add entries to database</p>
    </div>
  </a>  

  <a href="/search" class="w3-block w3-hover-opacity" style="text-decoration: none;">
    <div class="w3-card w3-container w3-round-xlarge w3-black action-card">
      <h3>Search</h3>
      <i class="fa fa-search" aria-hidden="true" style="font-size:90px; color:#1abc9c; margin: 25px 0;"></i>
      <p>Search database</p>
    </div>
  </a>  

  <a href="/delete" class="w3-block w3-hover-opacity" style="text-decoration: none;">
    <div class="w3-card w3-container w3-round-xlarge w3-black action-card">
      <h3>Delete</h3>
      <i class="fa fa-trash" aria-hidden="true" style="font-size:90px; color:#1abc9c; margin: 25px 0;"></i>
      <p>Delete from database</p>
    </div>
  </a>  

</div>

<!-- Footer -->
<footer class="w3-container w3-padding" id="myFooter">
  <p>Powered by <a href="https://www.w3schools.com/w3css/default.asp" target="_blank">w3.css</a></p>
  <div style="position:relative;bottom:55px;" class="w3-tooltip w3-right">
    <span class="w3-text w3-theme w3-padding">Go To Top</span>&nbsp;   
    <a class="w3-text-white" href="#myHeader"><span class="w3-xlarge">
    <i class="fa fa-chevron-circle-up"></i></span></a>
  </div>
</footer>

<!-- Script for Sidebar -->
<script>
function w3_open() {
  var x = document.getElementById("mySidebar");
  x.style.width = "100%";
  x.style.fontSize = "40px";
  x.style.paddingTop = "10%";
  x.style.display = "block";
}

function w3_close() {
  document.getElementById("mySidebar").style.display = "none";
}
</script>

</body>
</html>
